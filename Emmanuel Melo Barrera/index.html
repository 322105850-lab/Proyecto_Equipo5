<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escuadras MMR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="encabezado">
    <h1>Escuadras MMR</h1>
    <p>Registra jugadores, arma tu escuadra y compara puntajes.</p>
  </header>

  <main class="contenedor">

    <!-- 1. Registro de jugadores -->
    <section class="tarjeta" id="seccion-registro">
      <h2>Registrar jugador</h2>
      <form id="form-jugador" class="formulario">

        <label for="gamertag">Gamertag</label>
        <input type="text" id="gamertag" placeholder="Ej. ShadowFox" required>

        <label for="edad">Edad (mínimo 15)</label>
        <input type="number" id="edad" min="15" placeholder="15" required>

        <label for="victorias">Partidas ganadas</label>
        <input type="number" id="victorias" min="0" placeholder="0" required>

        <label for="rol">Rol</label>
        <select id="rol" required>
          <option value="">Elige un rol</option>
          <option value="estrategia">Estrategia</option>
          <option value="accion">Acción</option>
        </select>

        <!-- Solo se muestra uno, según el rol (lo controla index.js con la clase "oculto") -->
        <div id="campo-objetivos" class="oculto">
          <label for="objetivos">Objetivos cumplidos</label>
          <input type="number" id="objetivos" min="0" placeholder="0">
        </div>
        <div id="campo-ratio" class="oculto">
          <label for="ratio">Ratio de eliminaciones</label>
          <input type="number" id="ratio" min="0" step="0.1" placeholder="0.0">
        </div>

        <p id="mensaje-registro" class="mensaje" role="alert"></p>
        <button type="submit" id="btn-registrar" class="boton">Registrar jugador</button>
      </form>
    </section>

    <!-- 2. Escuadra -->
    <section class="tarjeta" id="seccion-escuadra">
      <h2>Mi escuadra</h2>
      <p class="contador"><span id="cupo-escuadra">0</span> de 5 jugadores</p>
      <ul id="lista-escuadra" class="lista">
        <li class="vacio">Aún no hay jugadores en la escuadra.</li>
      </ul>
      <p id="mensaje-escuadra" class="mensaje" role="alert"></p>
      <div class="promedio">
        <span>MMR promedio</span>
        <strong id="mmr-promedio">0</strong>
      </div>
    </section>

    <!-- 3. Puntajes -->
    <section class="tarjeta tarjeta-ancha" id="seccion-puntajes">
      <h2>Jugadores registrados</h2>
      <div id="lista-jugadores" class="grid-jugadores">
        <p class="vacio">Registra tu primer jugador para verlo aquí.</p>
      </div>
    </section>

  </main>

  <!-- Plantilla de ejemplo de una tarjeta de jugador (index.js puede copiar esta estructura) -->

    <span class="insignia estrategia">Estrategia</span>
    <h3>ShadowFox</h3>
    <p>Edad: 18 · Victorias: 12</p>
    <p class="mmr">MMR <strong>145</strong></p>
    <button class="boton boton-sec" data-gamertag="ShadowFox">Agregar a escuadra</button>
  </article>
  -->

  <script src="index.js" type="module"></script>
</body>
</html>
